name: Auto-Generate Syllabus Manifest

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'manifest.json'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Manifest Generator
        run: python generate_manifest.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate syllabus manifest.json [skip ci]" && git push)
